<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />

    <!-- أيقونة التبويب في أعلى المتصفح (Favicon) بنفس كود الشعار بدون ملفات خارجية -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23D4AF37'/%3E%3Cstop offset='100%25' stop-color='%238B6914'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M 68 32 C 60 20, 38 20, 32 32 C 26 44, 74 48, 68 68 C 62 80, 40 80, 32 68' stroke='%23ffffff' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M 76 22 L 76 14 M 72 18 L 80 18' stroke='%23ffffff' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='76' cy='18' r='1.5' fill='%23ffffff'/%3E%3C/svg%3E"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#D4AF37" />
    <meta name="description" content="Styloraify - استوديو تصميم الأزياء بالذكاء الاصطناعي" />

    <title>Styloraify | AI Fashion Studio</title>

    <style>
      body {
        margin: 0;
        background-color: #FAFAFA;
      }
      .styloraify-preloader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .styloraify-preloader svg {
        width: 95px;
        height: 95px;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        filter: drop-shadow(0 10px 20px rgba(212, 175, 55, 0.25));
      }
      .styloraify-title {
        margin-top: 1.5rem;
        font-size: 1.8rem;
        font-weight: 900;
        background: linear-gradient(to left, #D4AF37, #8B6914);
        -webkit-background-clip: text;
        color: transparent;
        letter-spacing: 2px;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.04); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root">
      <!-- الشعار الظاهر وسط الصفحة أثناء التحميل -->
      <div class="styloraify-preloader">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="100" height="100" rx="24" fill="url(#gold-gradient)" />
          <path
            d="M 68 32 C 60 20, 38 20, 32 32 C 26 44, 74 48, 68 68 C 62 80, 40 80, 32 68"
            stroke="#ffffff"
            stroke-width="8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M 76 22 L 76 14 M 72 18 L 80 18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
          <circle cx="76" cy="18" r="1.5" fill="#ffffff" />
          <defs>
            <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#D4AF37" />
              <stop offset="100%" stop-color="#8B6914" />
            </linearGradient>
          </defs>
        </svg>

        <div class="styloraify-title">Styloraify</div>
      </div>
    </div>
  </body>
</html>
